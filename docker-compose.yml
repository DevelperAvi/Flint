version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Flint Platform — Docker Compose (Development)
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   postgres  — Primary database (PostgreSQL 16)
#   redis     — Cache, feed queue, rate limiting (Redis 7)
#   minio     — S3-compatible local object storage (MinIO)
#   api       — Flint Backend API (Fastify + Node.js)
#   web       — Flint Frontend (Next.js 14)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  flint-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flintpassword}
      POSTGRES_DB: flint_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flint -d flint_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flint-network

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flint-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flint-network

  # ─── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: flint-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - flint-network

  # ─── MinIO Bucket Initialization ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: flint-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing myminio/flint-media;
        mc anonymous set download myminio/flint-media;
        echo '✅ MinIO bucket initialized';
      "
    networks:
      - flint-network

  # ─── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: flint-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flint:${POSTGRES_PASSWORD:-flintpassword}@postgres:5432/flint_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/flint-media
      S3_BUCKET_NAME: flint-media
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_REGION: us-east-1
      NODE_ENV: development
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./apps/api/prisma:/app/prisma:ro
    command: >
      sh -c "npx prisma migrate deploy && npm run dev"
    networks:
      - flint-network

  # ─── Frontend Web ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: flint-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/src:ro
    networks:
      - flint-network
